            --bg-light: #FAF8F5;

            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
            overflow-x: hidden;
        }

        a {

            color: inherit;
        }

        ul {

        }

        .container {

            margin: 0 auto;
            padding: 0 20px;

        .top-bar {
            background-color: var(--primary-dark);
            color: #F0E6DF;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 0;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .top-bar span {

            font-weight: 700;

            background-color: rgba(255, 255, 255, 0.95);

            z-index: 1000;

            box-shadow: var(--shadow-sm);

            align-items: center;
            justify-content: space-between;
            height: 80px;

            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .svg-logo {
            width: 65px;
            height: 65px;
            transition: var(--transition);
        }

        .logo-link:hover .svg-logo {
            transform: scale(1.04);
        }

        .brand-title {
            display: flex;
            flex-direction: column;
        }

        .brand-title .main-name {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .brand-title .sub-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* Nav links */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            transition: var(--transition);
            position: relative;
        }

        .nav-link:hover {
            color: var(--accent);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: var(--accent);
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Nav Actions */

            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-wa-header {
            display: flex;

            background-color: #25D366;
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
        }

        .btn-wa-header:hover {
            background-color: #20bd5a;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.4);
        }

        .cart-trigger {
            position: relative;
            background: var(--bg-light);
            border: 1px solid var(--border);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--primary);
        }

        .cart-trigger:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .cart-badge {
            position: absolute;

            font-size: 11px;

            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

            color: white;
            padding: 70px 0 90px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;

            height: 100%;
            background: radial-gradient(circle, rgba(217, 107, 39, 0.15) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
        }

            display: grid;

            gap: 40px;

            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;

        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            line-height: 1.15;
            font-weight: 700;
